services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: promorunner
      POSTGRES_USER: promorunner
      POSTGRES_PASSWORD: promorunner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promorunner -d promorunner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/promorunner
      SPRING_DATASOURCE_USERNAME: promorunner
      SPRING_DATASOURCE_PASSWORD: promorunner
      REDIS_URL: redis://redis:6379
      APP_REDIS_ENABLED: "true"
      APP_TENANCY_ALLOW_DEV_DEFAULT_SLUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
