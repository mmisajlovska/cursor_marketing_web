name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: promorunner
          POSTGRES_USER: promorunner
          POSTGRES_PASSWORD: promorunner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promorunner -d promorunner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        env:
          POSTGRES_HOST: localhost
        run: |
          chmod +x mvnw
          ./mvnw -B spotless:check verify
