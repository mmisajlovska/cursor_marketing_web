server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: promo-runner-api
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
  tenancy:
    header-name: X-Tenant-Slug
    allow-dev-default-slug: false
    dev-default-slug: demo
  cors:
    additional-origins: []
